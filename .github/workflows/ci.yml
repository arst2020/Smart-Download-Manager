name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/SDM.Core.Tests/SDM.Core.Tests.csproj -c Release

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build SmartDownloadManager.sln -c Release
      - run: dotnet publish src/SDM.App/SDM.App.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Check that the native host and the extension ship with the app
        shell: pwsh
        run: |
          foreach ($f in 'publish/SmartDownloadManager.exe', 'publish/SmartDownloadManager.Host.exe', 'publish/SmartDownloadManager.Host.dll', 'publish/extension/manifest.json', 'publish/extension/background.js') {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }
      - name: Installer builds (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=0.0.0 /DSourceDir=..\publish installer\SmartDownloadManager.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDownloadManager-win-x64
          path: publish
      - uses: actions/upload-artifact@v4
        with:
          name: SmartDownloadManager-Setup
          path: dist
